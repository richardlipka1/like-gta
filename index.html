<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Like GTA</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; image-rendering: pixelated; }
    #overlay { position: absolute; top: 10px; right: 10px; color: #fff; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    WASD / Arrows: Move<br>
    E: Enter/Exit Car<br>
    Space: Shoot<br>
    R: Restart (if dead)
  </div>
  <script src="dist/game.js"></script>
</body>
</html>
